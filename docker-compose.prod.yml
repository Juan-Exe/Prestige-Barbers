# =====================================================================
#  Configuracion para PRODUCCION
#
#  Uso en el servidor:
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
#  Importante: se pasan los dos archivos con -f a proposito, para que
#  Docker NO cargue docker-compose.override.yml (que es de desarrollo
#  y forzaria NODE_ENV=development y volumenes locales).
# =====================================================================

services:
  mariadb:
    # La base de datos NO se expone a internet: solo es accesible desde
    # la red interna de Docker, que es donde vive el backend.
    ports: !reset []

  backend:
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    # Sin montar el codigo: la imagen se construye con el frontend dentro.
    # Cualquier cambio requiere reconstruir con --build.
    volumes:
      - ./Backend/uploads:/app/uploads
      - ./Backend/logs:/app/logs
    ports:
      - "${APP_PORT:-3000}:3000"

  adminer:
    # Adminer queda DESACTIVADO en produccion: es un panel de administracion
    # de base de datos sin proteccion propia y no hace falta para que la
    # aplicacion funcione. Ademas, su fallo al enlazar el puerto abortaba
    # el arranque de todo el stack (Docker 29.1.3).
    #
    # Para consultar la base de datos directamente:
    #   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
    #       exec mariadb mariadb -u root -p barberia
    profiles: ["debug"]
    ports: !reset []
