services:
  # Servicio de MariaDB
  mariadb:
    image: mariadb:latest
    container_name: prestige-barbers-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${DB_NAME:-barberia}
      MYSQL_USER: ${DB_USER:-prestige_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-prestige_password123}
      MARIADB_CHARACTER_SET: utf8mb4
      MARIADB_COLLATION: utf8mb4_general_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      # Volumen para datos persistentes
      - mariadb_data:/var/lib/mysql
      # Montar el dump SQL para inicialización automática
      - ./barberia.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - prestige-network
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      timeout: 3s
      retries: 5
      interval: 10s

  # Servicio de Node.js Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prestige-barbers-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER:-prestige_user}
      DB_PASSWORD: ${DB_PASSWORD:-prestige_password123}
      DB_NAME: ${DB_NAME:-barberia}
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_in_production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://192.168.1.36:3000}
      # ---- Factus Pay (pasarela QR Bre-B) ----
      FACTUS_PAY_BASE_URL: ${FACTUS_PAY_BASE_URL:-https://pay-api-sandbox.factus.com.co}
      FACTUS_PAY_EMAIL: ${FACTUS_PAY_EMAIL:-}
      FACTUS_PAY_PASSWORD: ${FACTUS_PAY_PASSWORD:-}
      FACTUS_PAY_WEBHOOK_KEY: ${FACTUS_PAY_WEBHOOK_KEY:-}
      FACTUS_QR_EXPIRATION_SECONDS: ${FACTUS_QR_EXPIRATION_SECONDS:-1800}
      FACTUS_PAY_TIMEOUT_MS: ${FACTUS_PAY_TIMEOUT_MS:-10000}
      FACTUS_RATE_LIMIT_MAX: ${FACTUS_RATE_LIMIT_MAX:-30}
      # ---- Factus Facturacion (factura electronica DIAN) ----
      FACTUS_API_BASE_URL: ${FACTUS_API_BASE_URL:-https://api-sandbox.factus.com.co}
      FACTUS_CLIENT_ID: ${FACTUS_CLIENT_ID:-}
      FACTUS_CLIENT_SECRET: ${FACTUS_CLIENT_SECRET:-}
      FACTUS_USERNAME: ${FACTUS_USERNAME:-}
      FACTUS_PASSWORD: ${FACTUS_PASSWORD:-}
      FACTUS_NUMBERING_RANGE_ID: ${FACTUS_NUMBERING_RANGE_ID:-}
      FACTUS_DEFAULT_MUNICIPALITY_CODE: ${FACTUS_DEFAULT_MUNICIPALITY_CODE:-}
      # ---- Correo (envio de facturas) ----
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Prestige Barbers}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Volumen para uploads
      - ./Backend/uploads:/app/uploads
      # Volumen para logs
      - ./Backend/logs:/app/logs
      # Volumen para node_modules
      - /app/node_modules
    networks:
      - prestige-network
    healthcheck:
      # 127.0.0.1 (no localhost) porque en Node 18 localhost resuelve
      # primero a ::1 y el servidor escucha solo en IPv4. La cabecera
      # x-forwarded-proto evita el 301 a HTTPS que aplica produccion.
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3000,path:'/api/auth/me',headers:{'x-forwarded-proto':'https'}},r=>process.exit(r.statusCode===401?0:1)).on('error',()=>process.exit(1))"]
      timeout: 5s
      retries: 5
      interval: 30s
      start_period: 15s

  # Adminer - Herramienta web para administrar BD (opcional)
  adminer:
    image: adminer:latest
    container_name: prestige-barbers-adminer
    restart: unless-stopped
    depends_on:
      - mariadb
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - prestige-network
    environment:
      ADMINER_DEFAULT_SERVER: mariadb

networks:
  prestige-network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
